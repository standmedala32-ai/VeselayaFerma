<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Весёлая ферма 3D</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb;color:white}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:#17251dcc;border:1px solid #ffffff35;border-radius:14px;padding:10px;backdrop-filter:blur(8px)}
#top{position:absolute;top:10px;left:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#coins{font-weight:bold;color:#ffe36b}
#online{font-size:12px;color:#9cffad}
#buttons{position:absolute;right:15px;bottom:20px;display:flex;flex-direction:column;gap:9px;pointer-events:auto}
button{border:0;border-radius:13px;padding:13px 16px;background:#4c9b48;color:white;font-size:15px;font-weight:bold;box-shadow:0 3px 0 #28652c}
button:active{transform:translateY(2px);box-shadow:none}
#joystick{position:absolute;left:25px;bottom:25px;width:120px;height:120px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff70;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffffffb0;left:34px;top:34px}
#message{position:absolute;bottom:155px;left:50%;transform:translateX(-50%);background:#17251ddd;padding:10px 16px;border-radius:12px;display:none;white-space:nowrap}
#shop{display:none;position:absolute;inset:0;background:#0009;align-items:center;justify-content:center;pointer-events:auto}
#shopbox{width:min(90%,380px);max-height:80vh;overflow:auto;background:#253b2b;border:2px solid #8cbd72;border-radius:18px;padding:18px}
.shopitem{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;padding:10px;background:#ffffff15;border-radius:10px}
#close{float:right;background:#a83c3c}
#rotate{display:none;position:fixed;inset:0;background:#182b23;z-index:10;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px}
#help{position:absolute;left:50%;top:75px;transform:translateX(-50%);font-size:12px;color:white;text-shadow:0 2px 3px #000;white-space:nowrap}
@media(orientation:portrait){
 #rotate{display:flex}
}
</style>
</head>

<body>

<div id="rotate">📱<br><br>Поверни телефон горизонтально</div>

<div id="ui">
 <div id="top">
  <div class="panel">🌾 Весёлая ферма 3D</div>
  <div class="panel" id="coins">🪙 100</div>
  <div class="panel" id="online">🌐 Подключение...</div>
 </div>

 <div id="help">Используй джойстик для движения</div>

 <div id="joystick"><div id="stick"></div></div>

 <div id="buttons">
  <button onclick="action()">✋ Действие</button>
  <button onclick="openShop()">🏪 Магазин</button>
  <button onclick="plant()">🌱 Посадить</button>
  <button onclick="harvest()">🌾 Собрать</button>
 </div>

 <div id="message"></div>

 <div id="shop">
  <div id="shopbox">
   <button id="close" onclick="closeShop()">Закрыть</button>
   <h2>🏪 Магазин фермы</h2>
   <p>Покупай семена для своей фермы.</p>
   <div class="shopitem">
    <span>🥕 Семена моркови — 10 🪙</span>
    <button onclick="buySeed('carrot')">Купить</button>
   </div>
   <div class="shopitem">
    <span>🌽 Семена кукурузы — 15 🪙</span>
    <button onclick="buySeed('corn')">Купить</button>
   </div>
   <div class="shopitem">
    <span>🍅 Семена помидоров — 20 🪙</span>
    <button onclick="buySeed('tomato')">Купить</button>
   </div>
   <div class="shopitem">
    <span>🐔 Курица — 50 🪙</span>
    <button onclick="buyAnimal('chicken')">Купить</button>
   </div>
   <div class="shopitem">
    <span>🐄 Корова — 100 🪙</span>
    <button onclick="buyAnimal('cow')">Купить</button>
   </div>
   <div class="shopitem">
    <span>🐷 Свинья — 80 🪙</span>
    <button onclick="buyAnimal('pig')">Купить</button>
   </div>
  </div>
 </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,35,100);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const sunlight = new THREE.DirectionalLight(0xffffff,2);
sunlight.position.set(-20,35,20);
sunlight.castShadow=true;
scene.add(sunlight);
scene.add(new THREE.HemisphereLight(0xffffff,0x668844,1.2));

const mat=(color)=>new THREE.MeshStandardMaterial({color});
const grass=mat(0x69b84b);
const brown=mat(0x79502d);
const wood=mat(0x9b6234);
const white=mat(0xffffff);
const black=mat(0x222222);

function cube(x,y,z,sx,sy,sz,material,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function sphere(x,y,z,r,material,parent=scene){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),material);
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);
 return m;
}

// Земля
cube(0,-.5,0,120,1,120,grass);

// Дорога
cube(0,.02,0,8,.08,100,mat(0xc5a16c));

// Дом
const house=new THREE.Group();
cube(0,1,0,7,3,6,mat(0xe6c99a),house);
const roof=new THREE.Mesh(
 new THREE.ConeGeometry(5.4,3,4),
 mat(0x9c3e2c)
);
roof.position.set(0,4,0);
roof.rotation.y=Math.PI/4;
roof.scale.set(1,1,.85);
house.add(roof);
cube(0,.9,3.06,1.2,1.8,.15,wood,house);
cube(-1.8,1.7,3.08,1.1,1,.15,mat(0x8bd8ef),house);
cube(1.8,1.7,3.08,1.1,1,.15,mat(0x8bd8ef),house);
house.position.set(-12,0,-12);
scene.add(house);

// Деревья
function tree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,8),wood);
 trunk.position.y=1;
 g.add(trunk);
 sphere(0,2.6,0,1.5,mat(0x238c39),g);
 sphere(-.7,2.3,.2,.8,mat(0x329c3e),g);
 sphere(.7,2.4,-.2,.8,mat(0x329c3e),g);
 g.position.set(x,0,z);
 scene.add(g);
}
for(let i=0;i<45;i++){
 const x=(Math.random()-.5)*85;
 const z=(Math.random()-.5)*85;
 if(Math.abs(x)>9 && Math.abs(z)>9) tree(x,z);
}

// Забор
for(let i=-12;i<=12;i++){
 for(const z of [-9,9]){
  cube(i,0.6,z,.25,1.2,.25,wood);
 }
}
for(let z=-9;z<=9;z++){
 for(const x of [-12,12]){
  cube(x,.6,z,.25,1.2,.25,wood);
 }
}

// Персонаж
const player=new THREE.Group();
const body=cube(0,1,0,.8,1.2,.5,mat(0x2874d0),player);
const head=sphere(0,1.95,0,.38,mat(0xf0bd8c),player);
const hat=cube(0,2.32,0,.9,.15,.9,mat(0x8a4c22),player);
const leg1=cube(-.22,.35,0,.25,.7,.3,mat(0x29344b),player);
const leg2=cube(.22,.35,0,.25,.7,.3,mat(0x29344b),player);
const arm1=cube(-.53,1.1,0,.2,.8,.2,mat(0xf0bd8c),player);
const arm2=cube(.53,1.1,0,.2,.8,.2,mat(0xf0bd8c),player);
player.position.set(0,0,5);
scene.add(player);

// Животные
const animals=[];
function makeAnimal(type,x,z){
 const g=new THREE.Group();
 let color=type==='cow'?0xf2f2f2:type==='pig'?0xf49caa:0xe9bd4a;
 sphere(0,.65,0,.55,mat(color),g);
 sphere(0,.85,.48,.35,mat(color),g);
 sphere(-.17,.94,.75,.06,black,g);
 sphere(.17,.94,.75,.06,black,g);
 if(type==='cow'){
  sphere(-.25,.8,.25,.19,black,g);
  sphere(.25,.6,-.2,.18,black,g);
 }
 if(type==='pig'){
  sphere(0,.68,.82,.18,mat(0xd66d80),g);
 }
 if(type==='chicken'){
  sphere(0,1.05,.1,.15,mat(0xe33b2f),g);
  sphere(0,.85,.78,.1,mat(0xe5a32a),g);
 }
 for(let i=0;i<4;i++){
  cube((i%2?1:-1)*.3,.2,(i<2?.25:-.25),.12,.4,.12,mat(0x55402e),g);
 }
 g.position.set(x,0,z);
 scene.add(g);
 animals.push({group:g,type,x,z,phase:Math.random()*6});
}
makeAnimal('chicken',4,3);
makeAnimal('chicken',6,2);
makeAnimal('cow',-5,5);
makeAnimal('pig',5,-5);

// Грядки
const plots=[];
const cropColors={
 carrot:0xff8b28,
 corn:0xe7d13b,
 tomato:0xe83b32
};
for(let i=0;i<6;i++){
 const x=-8+(i%3)*4;
 const z=4+Math.floor(i/3)*4;
 cube(x,.04,z,3,.12,2.5,brown);
 plots.push({x,z,seed:null,planted:0,mesh:null});
}

// Состояние
let coins=100;
let seeds={carrot:3,corn:0,tomato:0};
let selectedSeed='carrot';
let lastSave=0;

try{
 const saved=JSON.parse(localStorage.getItem('farmSave')||'null');
 if(saved){
  coins=saved.coins??100;
  seeds={...seeds,...saved.seeds};
  plots.forEach((p,i)=>{
   if(saved.plots?.[i]){
    p.seed=saved.plots[i].seed;
    p.planted=saved.plots[i].planted;
   }
  });
 }
}catch(e){}

function save(){
 localStorage.setItem('farmSave',JSON.stringify({
  coins,seeds,
  plots:plots.map(p=>({seed:p.seed,planted:p.planted}))
 }));
 updateUI();
}
function updateUI(){
 document.getElementById('coins').textContent='🪙 '+coins;
}
updateUI();

// Посев и рост
function updateCrops(){
 for(const p of plots){
  if(!p.seed) continue;
  const age=(Date.now()-p.planted)/1000;
  const stage=Math.min(3,Math.floor(age/10)+1);
  if(p.mesh && p.mesh.userData.stage===stage) continue;
  if(p.mesh) scene.remove(p.mesh);
  const g=new THREE.Group();
  const color=mat(cropColors[p.seed]);
  const height=.3+stage*.22;
  for(let i=0;i<stage;i++){
   const stem=cube((i%2)*.25-.12,height/2,p.z*0,.12,height,.12,mat(0x278c32),g);
   sphere((i%2)*.25-.12,height,0,.17,color,g);
  }
  g.position.set(p.x,.1,p.z);
  g.userData.stage=stage;
  scene.add(g);
  p.mesh=g;
 }
}
window.plant=function(){
 const p=plots.find(p=>!p.seed && Math.hypot(player.position.x-p.x,player.position.z-p.z)<3);
 if(!p){say('Подойди к свободной грядке');return}
 if(seeds[selectedSeed]<=0){say('Нет семян! Загляни в магазин');return}
 seeds[selectedSeed]--;
 p.seed=selectedSeed;
 p.planted=Date.now();
 updateCrops();
 save();
 say('🌱 Семена посажены!');
};
window.harvest=function(){
 const p=plots.find(p=>p.seed && Math.hypot(player.position.x-p.x,player.position.z-p.z)<3);
 if(!p){say('Подойди к грядке');return}
 if((Date.now()-p.planted)/1000<30){say('Урожай ещё растёт!');return}
 const reward=p.seed==='carrot'?25:p.seed==='corn'?35:45;
 coins+=reward;
 if(p.mesh)scene.remove(p.mesh);
 p.mesh=null;p.seed=null;p.planted=0;
 save();
 say('🌾 Урожай собран! +'+reward+' монет');
};

// Магазин
window.openShop=()=>document.getElementById('shop').style.display='flex';
window.closeShop=()=>document.getElementById('shop').style.display='none';

window.buySeed=function(type){
 const prices={carrot:10,corn:15,tomato:20};
 if(coins<prices[type]){say('Недостаточно монет');return}
 coins-=prices[type];seeds[type]++;
 selectedSeed=type;
 save();say('Семена куплены!');
};
window.buyAnimal=function(type){
 const prices={chicken:50,cow:100,pig:80};
 if(coins<prices[type]){say('Недостаточно монет');return}
 coins-=prices[type];
 makeAnimal(type,(Math.random()-.5)*10,(Math.random()-.5)*10);
 save();say('Новое животное на ферме!');
};

// Сообщения
let messageTimer;
function say(t){
 const el=document.getElementById('message');
 el.textContent=t;el.style.display='block';
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>el.style.display='none',2200);
}

// Действие рядом с объектами
window.action=function(){
 const animal=animals.find(a=>Math.hypot(player.position.x-a.group.position.x,player.position.z-a.group.position.z)<2.5);
 if(animal){
  coins+=5;save();say('❤️ Животное довольно! +5 монет');
  return;
 }
 const p=plots.find(p=>Math.hypot(player.position.x-p.x,player.position.z-p.z)<3);
 if(p?.seed){harvest();return}
 say('Подойди к животному или грядке');
};

// Управление
const keys={};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let joyX=0,joyY=0;
const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joyActive=false;

joystick.addEventListener('pointerdown',e=>{
 joyActive=true;joystick.setPointerCapture(e.pointerId);moveJoy(e);
});
joystick.addEventListener('pointermove',e=>{if(joyActive)moveJoy(e)});
joystick.addEventListener('pointerup',resetJoy);
joystick.addEventListener('pointercancel',resetJoy);

function moveJoy(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(x,y);
 if(len>38){x=x/len*38;y=y/len*38}
 joyX=x/38;joyY=y/38;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
function resetJoy(){
 joyActive=false;joyX=0;joyY=0;
 stick.style.transform='translate(0,0)';
}

// Камера и движение
let yaw=0;
let last=performance.now();
let networkTime=0;
let walkTime=0;

function updatePlayer(dt){
 let x=joyX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let z=joyY+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const len=Math.hypot(x,z);
 if(len>1){x/=len;z/=len}
 if(len>.05){
  player.position.x+=x*7*dt;
  player.position.z+=z*7*dt;
  player.rotation.y=Math.atan2(x,z);
  walkTime+=dt*10;
  leg1.rotation.x=Math.sin(walkTime)*.6;
  leg2.rotation.x=-Math.sin(walkTime)*.6;
  arm1.rotation.x=-Math.sin(walkTime)*.4;
  arm2.rotation.x=Math.sin(walkTime)*.4;
 }else{
  leg1.rotation.x=0;leg2.rotation.x=0;
  arm1.rotation.x=0;arm2.rotation.x=0;
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-45,45);
}

function updateCamera(){
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+1,
  player.position.z
 );
 const offset=new THREE.Vector3(0,8,12);
 offset.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
 camera.position.lerp(target.clone().add(offset),.1);
 camera.lookAt(target);
}

// Животные гуляют
function updateAnimals(dt,t){
 for(const a of animals){
  a.phase+=dt*.5;
  a.group.position.x=a.x+Math.sin(a.phase)*1.5;
  a.group.position.z=a.z+Math.cos(a.phase*.7)*1.5;
  a.group.rotation.y=Math.sin(a.phase)*.5;
 }
}

// Онлайн-мультиплеер
const remotePlayers=new Map();
let socket=null;

function makeRemotePlayer(id,data){
 if(id===socket?.id)return;
 let g=remotePlayers.get(id);
 if(!g){
  g=new THREE.Group();
  const shirt=cube(0,1,0,.8,1.2,.5,mat(0xd64d4d),g);
  sphere(0,1.95,0,.38,mat(0xf0bd8c),g);
  cube(0,2.32,0,.9,.15,.9,mat(0x8a4c22),g);
  scene.add(g);
  remotePlayers.set(id,g);
 }
 g.position.set(data.x||0,data.y||0,data.z||0);
 if(Number.isFinite(data.rotation))g.rotation.y=data.rotation;
}

function removeRemotePlayer(id){
 const g=remotePlayers.get(id);
 if(g){scene.remove(g);remotePlayers.delete(id)}
}

try{
 socket=io({
  reconnection:true,
  reconnectionAttempts:Infinity,
  reconnectionDelay:1500
 });

 socket.on('connect',()=>{
  document.getElementById('online').textContent='🌐 Онлайн: подключено';
 });

 socket.on('disconnect',()=>{
  document.getElementById('online').textContent='🌐 Переподключение...';
 });

 socket.on('connect_error',()=>{
  document.getElementById('online').textContent='🌐 Сервер недоступен';
 });

 socket.on('players:initial',players=>{
  players.forEach(p=>makeRemotePlayer(p.id,p));
 });

 socket.on('player:joined',p=>makeRemotePlayer(p.id,p));
 socket.on('player:update',p=>makeRemotePlayer(p.id,p));
 socket.on('player:left',removeRemotePlayer);

}catch(e){
 document.getElementById('online').textContent='🌐 Офлайн';
}

function sendPlayerPosition(now){
 if(!socket?.connected)return;
 if(now-networkTime<80)return;
 networkTime=now;
 socket.emit('player:update',{
  x:player.position.x,
  y:player.position.y,
  z:player.position.z,
  rotation:player.rotation.y
 });
}

// Игровой цикл
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.05);
 last=now;
 updatePlayer(dt);
 updateAnimals(dt,now/1000);
 updateCrops();
 updateCamera();
 sendPlayerPosition(now);
 renderer.render(scene,camera);
}
camera.position.set(0,10,18);
loop(performance.now());

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
});

setInterval(save,10000);
window.addEventListener('beforeunload',save);
</script>
</body>
</html>
